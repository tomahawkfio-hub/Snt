name: Testes do SNT Links
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar testes
        run: npm test
      - name: Verificar sintaxe
        run: |
          node --check worker.mjs
          node --check dashboard.mjs
